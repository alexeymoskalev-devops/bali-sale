<!DOCTYPE html>

<body>
<div class="page">
  <div class="container">

    <header class="site-header">
      <span class="eyebrow" data-t="location">Canggu, Bali</span>
      <div class="lang-switch">
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <section class="hero">
      <h1 class="hero-title" data-t="title"></h1>
      <p class="hero-lede" data-t="lede"></p>
      <div class="hero-facts">
        <div class="fact">
          <span class="fact-label" data-t="pickupLabel"></span>
          <span class="fact-value" data-t="pickupValue"></span>
        </div>
        <div class="fact">
          <span class="fact-label" data-t="priceLabel"></span>
          <span class="fact-value" data-t="negotiable"></span>
        </div>
        <div class="fact">
          <span class="fact-label" data-t="contactLabel"></span>
          <a class="fact-value" href="https://t.me/alex_xmos" target="_blank" rel="noopener">@alex_xmos</a>
        </div>
      </div>
    </section>

    <div class="items-header">
      <h2 class="section-title" data-t="itemsHeading"></h2>
      <span class="items-count" id="available-text"></span>
    </div>

    <div class="grid" id="grid"></div>

    <section class="map-section">
      <div class="map-info">
        <h2 class="section-title section-title--big" data-t="mapHeading"></h2>
        <p class="map-body" data-t="mapBody"></p>
        <a class="btn-primary" href="https://t.me/alex_xmos" target="_blank" rel="noopener" data-t="mapCta"></a>
      </div>
      <div class="map-frame">
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=115.115%2C-8.672%2C115.165%2C-8.628&amp;layer=mapnik&amp;marker=-8.6478%2C115.1385" loading="lazy" title="Canggu"></iframe>
      </div>
    </section>

    <footer class="site-footer">
      <span data-t="footerNote"></span>
      <a href="https://t.me/alex_xmos" target="_blank" rel="noopener">Telegram @alex_xmos</a>
    </footer>

  </div>

<div class="modal-backdrop" id="modal" hidden></div>

<script src="app.js?v=2"></script>
